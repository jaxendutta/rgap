name: Monthly data refresh

on:
  schedule:
    # 06:00 UTC on the 15th of every month ("mid-month")
    - cron: '0 6 15 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Fetch, preprocess, and upsert grants data
        working-directory: pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python fetch_and_load.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bump LAST_UPDATED
        run: node scripts/bump-last-updated.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/constants/data.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: bump last data update date"
            git push
          fi
